<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>بازی‌های زانیس</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toast" role="status"></div>
    <script>
      // The games need a WebView/browser from 2020 or later (Chromium 86+). Older ones cannot even
      // parse the modules, so tell the operator what to do instead of showing a blank screen.
      if (!('replaceChildren' in Element.prototype) || !('noModule' in HTMLScriptElement.prototype)) {
        document.getElementById('app').innerHTML =
          '<div style="margin:auto;text-align:center;line-height:2;padding:24px">' +
          '<h2>مرورگر داخلی این دستگاه قدیمی است</h2>' +
          '<p>برنامهٔ «Android System WebView» را از فروشگاه به‌روز کنید و دوباره وارد شوید.</p></div>';
      }
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
