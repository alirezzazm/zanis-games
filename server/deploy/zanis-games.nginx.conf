# zgp.game.aliizz.ir: the game server (dashboard, /api, /play). Installed as
# /etc/nginx/conf.d/zanis-games.conf. Port 443 belongs to the devstack stream router, which hands
# every TLS connection to 127.0.0.1:8443 with the PROXY protocol; this block takes this one name.
# The certificate is this site's own (acme.sh, see deploy.sh), separate from the devstack one.
server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name zgp.game.aliizz.ir;

    ssl_certificate     /opt/zanis-games/certs/fullchain.cer;
    ssl_certificate_key /opt/zanis-games/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://127.0.0.1:18300;
    }
}
