name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', 'web/js/game/settings.js', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        run: dotnet test Zanis.Games.slnx -c Release
